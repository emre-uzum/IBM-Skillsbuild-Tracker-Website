spring.config.import=optional:application-local.properties
spring.application.name=group34

spring.mvc.view.prefix=/templates


# Override these values with environment variables or application-local.properties.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/group34}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.web.resources.static-locations=classpath:/static/
